[package]
name = "qor"
version = "1.0.0"
description = "Secure messaging application"
authors = ["galacticoderr"]
edition = "2024"
rust-version = "1.91"
autobins = false

[lib]
name = "qor_chat_lib"
path = "src/main.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "qor"
path = "src/desktop.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
blake3 = "1"
sha2 = "0.10"

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon", "devtools", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full", "sync", "time", "process", "fs", "io-util", "net", "rt-multi-thread", "macros"] }
async-trait = "0.1"

# Cryptography
aes-gcm = { version = "0.10", features = ["aes"] }
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
sha3 = "0.10"
sha2 = "0.10"
blake3 = { version = "1", features = ["traits-preview"] }
hkdf = "0.12"
libcrux-ml-kem = { version = "0.0.8", default-features = false, features = ["mlkem1024", "std"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["precomputed-tables", "zeroize"] }

rand = "0.9"
getrandom = { version = "0.3", features = ["std"] }

subtle = { version = "2", features = ["std"] }
zeroize = { version = "1", features = ["derive", "std"] }

# Networking
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-socks = "0.5"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-native-certs = "0.8"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider", "socks", "gzip"] }
url = "2"

# System integration
notify-rust = "4"
open = "5"

# Database
rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
rusty-opus = "0.9.1"
flate2 = "1"
parking_lot = "0.12"
regex = "1"
lazy_static = "1"
futures-util = "0.3"
tar = "0.4"
sysinfo = "0.30"
cosmic-text = "0.14"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
arboard = { version = "3.6", default-features = false }

# Signal Protocol
[dependencies.libsignal-protocol]
git = "https://github.com/signalapp/libsignal"
rev = "7c8cb0c5fce1d01805199de992bf4323f4765f1f"
features = ["mlkem1024"]

[dependencies.spqr]
git = "https://github.com/signalapp/SparsePostQuantumRatchet.git"
tag = "v1.5.1"

# Platform-specific screen capture
[target.'cfg(target_os = "linux")'.dependencies]
scrap = "0.5"
x11rb = "0.13"
webkit2gtk = "=2.0.2"
v4l = "0.14.0"
pulseaudio = "0.3.1"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }

[target.'cfg(target_os = "windows")'.dependencies]
scrap = "0.5"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
cpal = "0.18.2"

# Unix signals
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# Windows API
[target.'cfg(target_os = "windows")'.dependencies.winapi]
version = "0.3"
features = ["libloaderapi", "winuser", "winbase"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
libcrux-ml-kem = { path = "../vendor/libcrux-ml-kem-0.0.8" }
libcrux-traits = { path = "../vendor/libcrux-traits-0.0.6" }
libcrux-intrinsics = { path = "../vendor/libcrux-intrinsics-0.0.6" }
hpke-rs = { path = "../vendor/hpke-rs-0.6.1" }
glib = { path = "../vendor/glib-0.18.5" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
panic = "abort"
strip = true
