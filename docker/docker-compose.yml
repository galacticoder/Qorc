services:
  redis:
    profiles: ["server", "loadbalancer", "redis-standalone"]
    build:
      context: "${QOR_DOCKER_BUILD_CONTEXT:-..}"
      dockerfile: docker/Dockerfile.redis
    hostname: redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - redis-certs:/certs
    networks:
      - Qor-Chat-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --tls --cert /certs/redis-client.crt --key /certs/redis-client.key --cacert /certs/redis-ca.crt ping | grep -qx PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    profiles: ["server"]
    build:
      context: "${QOR_DOCKER_BUILD_CONTEXT:-..}"
      dockerfile: docker/Dockerfile.postgres
    hostname: postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-certs:/var/lib/postgresql/certs
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${DB_PORT}:5432"
    networks:
      - Qor-Chat-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    profiles: ["server"]
    build:
      context: "${QOR_DOCKER_BUILD_CONTEXT:-..}"
      dockerfile: docker/Dockerfile.server
    hostname: server
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - BIND_ADDRESS=0.0.0.0
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=${DB_NAME}
      - PGUSER=postgres
      - PGPASSWORD=${DATABASE_PASSWORD}
      - DATABASE_URL=
      - PGSSLROOTCERT=/app/postgres-certs/root.crt
      - DB_TLS_SERVERNAME=postgres
      - REDIS_URL=rediss://redis:6379
      - NO_GUI
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - Qor-Chat-net
    volumes:
      - ../.env:/app/.env
      - ../scripts:/app/scripts:rw
      - ../server:/app/server:rw
      - ../shared:/app/shared:ro
      - ../logs:/app/logs:rw
      - redis-certs:/app/redis-certs:ro
      - postgres-certs:/app/postgres-certs:ro
    restart: unless-stopped

  loadbalancer:
    profiles: ["loadbalancer"]
    build:
      context: "${QOR_DOCKER_BUILD_CONTEXT:-..}"
      dockerfile: docker/Dockerfile.loadbalancer
    hostname: loadbalancer
    ports:
      - "${HAPROXY_HTTPS_PORT:-8443}:8443"
      - "${HAPROXY_STATS_PORT:-8404}:8404"
    env_file:
      - ../.env
    environment:
      - HAPROXY_HTTPS_PORT=8443
      - HAPROXY_STATS_PORT=8404
      - TOR_HS_INTRO_POINTS=${TOR_HS_INTRO_POINTS:-3}
      - REDIS_URL=rediss://redis:6379
      - REDIS_CA_CERT_PATH=/app/redis-certs/redis-ca.crt
      - REDIS_CLIENT_CERT_PATH=/app/redis-certs/redis-client.crt
      - REDIS_CLIENT_KEY_PATH=/app/redis-certs/redis-client.key
      - REDIS_TLS_SERVERNAME=redis
      - NO_GUI
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - Qor-Chat-net
    volumes:
      - ../.env:/app/.env
      - ../scripts:/app/scripts:rw
      - ../server:/app/server:rw
      - ../shared:/app/shared:ro
      - redis-certs:/app/redis-certs:ro
    tmpfs:
      - /var/run
    restart: unless-stopped

networks:
  Qor-Chat-net:
    driver: bridge

volumes:
  postgres-data:
  postgres-certs:
  redis-data:
  redis-certs:
